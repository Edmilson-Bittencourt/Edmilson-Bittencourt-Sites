<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Edmilson Bittencourt - Portfólio</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI', sans-serif;}
body{color:#fff; overflow-x:hidden; background:#000;}
#video-bg{position:fixed;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:-2;}
.overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.6);z-index:-1;}
header{text-align:center;padding:80px 20px;}
header h1{font-size:3rem; text-shadow:0 2px 15px rgba(0,0,0,0.7);}
.sobre,.projetos,.contato{max-width:1100px;margin:40px auto;padding:30px 20px;text-align:center;background:rgba(0,0,0,0.4);border-radius:20px;backdrop-filter:blur(8px);}
.grid-projetos{display:grid;grid-template-columns:repeat(auto-fit, minmax(320px, 1fr));gap:30px;margin-top:30px;}
.card-projeto{background:rgba(0,0,0,0.5);border-radius:20px;overflow:hidden;border:1px solid rgba(255,255,255,0.15); text-align:left;}
.card-projeto img{width:100%;height:200px;object-fit:cover;display:block;background:#222;}
.card-conteudo{padding:20px;}
.card-conteudo h3{font-size:1.5rem; margin-bottom:10px;}
.card-conteudo p{color:#ddd; margin-bottom:20px; min-height:60px;}
.btn-projeto{display:inline-block;padding:10px 20px;background:#007BFF;color:#fff;text-decoration:none;border-radius:25px;font-weight:bold;}
.botoes-contato{display:flex;justify-content:center;gap:15px;flex-wrap:wrap;margin-top:20px;}
.btn-contato{padding:12px 24px;border-radius:25px;text-decoration:none;font-weight:bold;color:#fff;}
.btn-whats{background:#25D366;}.btn-insta{background:#E1306C;}
footer{text-align:center;padding:20px;color:#ddd;}
</style>
</head>
<body>
<video autoplay muted loop playsinline id="video-bg"><source src="mar.mp4" type="video/mp4"></video>
<div class="overlay"></div>
<header><h1>Edmilson Bittencourt</h1><p>Desenvolvedor de Projetos Digitais</p></header>
<section class="projetos"><h2>Meus Projetos</h2><div class="grid-projetos" id="lista-projetos"><p>Carregando projetos...</p></div></section>
<section class="contato">
    <h2>Vamos criar seu projeto?</h2>
    <div class="botoes-contato">
        <a href="https://wa.me/5551985108885?text=Ol%C3%A1%20Edmilson%2C%20vim%20pelo%20seu%20portf%C3%B3lio%20e%20gostaria%20de%20um%20or%C3%A7amento." target="_blank" class="btn-contato btn-whats">WhatsApp</a>
        <a href="https://instagram.com/edmilsonbittencourt" target="_blank" class="btn-contato btn-insta">Instagram</a>
    </div>
</section>
<footer><p>© 2026 Edmilson Bittencourt</p></footer>
<script>
const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vRdrODbSUGBAJEGawcIqzyRLGA-P60A1nPnMJH9OTT-MRIuANdilj3rL-mrbslWppKpFG0OTZAa7KtV/pub?output=csv";

function driveToImg(link){
  if(!link) return "";
  let id="";
  link=link.trim();
  if(link.includes("id=")) id=link.split("id=")[1].split("&")[0].split("/")[0];
  else { let m=link.match(/\/d\/([a-zA-Z0-9-_]+)/); if(m) id=m[1]; }
  return id? `https://drive.google.com/thumbnail?id=${id}&sz=w1000` : link;
}

async function carregar(){
  try{
    const r = await fetch(CSV_URL);
    const txt = await r.text();
    // separa por linha e pega tudo, sem validar nome de coluna
    const linhas = txt.split("\n").filter(l=>l.trim()!=="");
    // remove cabeçalho
    linhas.shift();
    const container = document.getElementById("lista-projetos");
    container.innerHTML="";
    linhas.forEach(linha=>{
      // divide por vírgula, mas respeita aspas
      const cols = linha.split(/,(?=(?:(?:[^"]*"){2})*[^"]*$)/).map(c=>c.replace(/^"|"$/g,"").trim());
      if(cols.length < 2 ||!cols[0]) return;
      const nome = cols[0];
      const desc = cols[1] || "";
      const imgRaw = cols[2] || "";
      const link = cols[3] || "#";
      const img = driveToImg(imgRaw);
      container.innerHTML += `
        <div class="card-projeto">
          <img src="${img}" onerror="this.src='https://via.placeholder.com/400x200?text=${encodeURIComponent(nome)}'">
          <div class="card-conteudo"><h3>${nome}</h3><p>${desc}</p><a href="${link}" target="_blank" class="btn-projeto">Ver Site Ao Vivo</a></div>
        </div>`;
    });
    if(container.innerHTML==="") container.innerHTML="<p>Nada na planilha. Confere se publicou como CSV.</p>";
  }catch(e){ document.getElementById("lista-projetos").innerHTML="<p>Erro ao carregar planilha. Tem que estar em Publicar na Web.</p>"; }
}
carregar();
</script>
</body>
</html>
